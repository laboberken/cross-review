name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e
          test -f README.md
          test -f README.zh-CN.md
          test -f LICENSE

      - name: Check the toolkit holds its skill
        run: |
          set -e
          test -f skills/cross-review/SKILL.md
          test -f skills/cross-review/references/finding-format.md

      - name: Validate every SKILL.md frontmatter
        run: |
          set -e
          for dir in skills/*/; do
            name=$(basename "$dir")
            f="$dir/SKILL.md"
            echo "--- $name"
            head -n 1 "$f" | grep -q '^---$'
            grep -q "^name: $name$" "$f"
            grep -q '^description:' "$f"
            grep -q '^license: MIT$' "$f"
          done

      - name: Check cross-review references
        run: |
          set -e
          for f in lenses axes spec-sources agents task-packet troubleshooting; do
            test -f "skills/cross-review/references/$f.md"
          done

      - name: Check the axes are wired, not just referenced
        run: |
          set -e
          # All twelve smells must be present. One line, no continuations:
          # a line at column 0 would terminate this block scalar.
          for s in 'Mysterious Name' 'Duplicated Code' 'Feature Envy' 'Data Clumps' 'Primitive Obsession' 'Repeated Switches' 'Shotgun Surgery' 'Divergent Change' 'Speculative Generality' 'Message Chains' 'Middle Man' 'Refused Bequest'; do
            grep -q "$s" skills/cross-review/references/axes.md
          done
          # The two binding rules must both be stated.
          grep -qi 'repo overrides' skills/cross-review/references/axes.md
          grep -qi 'judgement call' skills/cross-review/references/axes.md
          # No workflow-specific directory may be privileged.
          ! grep -q 'docs/agents/\*\*' skills/cross-review/references/spec-sources.md

      - name: Check the review contract's axis/lens header
        run: |
          set -e
          f=skills/cross-review/references/finding-format.md
          grep -q '^AXIS: <' "$f"
          grep -q '^COVERED:' "$f"
          grep -q '^NOT COVERED:' "$f"
          # The header is tolerated when absent, so the contract must say so.
          grep -qi 'axis-undeclared' "$f"
          # The parts other harnesses depend on must survive verbatim.
          grep -q '`P0`: universal release blocker' "$f"
          grep -q 'say `No findings.`' "$f"

      - name: Templates defer to the finding format, not restate it
        run: |
          set -e
          # The templates carry standing rules only. The finding format has
          # one owner (references/finding-format.md) and the packet derives
          # its copy at assembly time; a template restating the format is a
          # second owner, which is the drift this repo keeps having to fix.
          # Match the heading anywhere on the line: a copy demoted to ### or
          # indented is still a copy (measured bypass of the column-0 form).
          marker='Flag a finding only when all of these are true'
          for tpl in skills/cross-review/templates/*.md; do
            if grep -q "$marker" "$tpl"; then
              echo "$tpl restates the finding format; templates defer to references/finding-format.md" >&2
              exit 1
            fi
            grep -q 'references/finding-format.md' "$tpl" ||
              { echo "$tpl does not reference the finding format" >&2; exit 1; }
          done
          echo "templates defer to the finding format"

      - name: Templates and the agent registry match two ways
        run: |
          set -e
          for tpl in skills/cross-review/templates/*.md; do
            name=$(basename "$tpl" .md)
            # reviewer -> "### claude (Claude Code)"; reviewer-codex -> "### codex ("
            agent=${name#reviewer}
            agent=${agent#-}
            [ -z "$agent" ] && agent=claude
            grep -qi "^### $agent" skills/cross-review/references/agents.md || {
              echo "template $name has no '### $agent' section in agents.md" >&2; exit 1; }
          done
          # and every registered agent that is a reviewer has a template
          for agent in claude codex opencode; do
            [ -f "skills/cross-review/templates/reviewer-$agent.md" ] ||
              [ "$agent" = claude -a -f skills/cross-review/templates/reviewer.md ] || {
              echo "agents.md registers $agent but there is no reviewer template" >&2; exit 1; }
          done
          echo "templates and registry agree"

      - name: No template ships an unfilled command placeholder
        run: |
          set -e
          for tpl in skills/cross-review/templates/*.md; do
            line=$(sed -n 's/^command: //p' "$tpl" | head -1)
            case "$line" in
              ""|TODO*|*"<TODO"*)
                echo "$tpl has no real launch line: '$line'" >&2
                echo "  run scripts/add-agent.sh $tpl with the agent's command" >&2
                exit 1 ;;
            esac
          done
          echo "every template has a launch line"

      - name: Check templates carry a launch line
        run: |
          set -e
          for f in skills/cross-review/templates/*.md; do
            head -n 1 "$f" | grep -q '^---$'
            grep -q '^command: ' "$f"
          done

      - name: Check examples
        run: |
          set -e
          count=$(find skills/cross-review/examples -name '*.md' | wc -l)
          echo "Example files: $count"
          test "$count" -ge 3

      - name: Check scripts parse, under dash as well as bash
        run: |
          set -e
          for f in skills/cross-review/scripts/*.sh; do
            bash -n "$f"
            # CI invokes these with sh, which is dash on this image.
            case "$(basename "$f")" in
              *.sh) dash -n "$f" ;;
            esac
          done

      - name: add-agent.sh produces a conforming template
        run: |
          set -e
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp -r skills/cross-review "$tmp/skill"
          sh "$tmp/skill/scripts/add-agent.sh" sampleagent "sample --review" > /dev/null
          tpl="$tmp/skill/templates/reviewer-sampleagent.md"
          test -f "$tpl"
          grep -q '^command: sample --review$' "$tpl"
          # The generated template is the shipped body with the launch line
          # replaced: add-agent.sh is an adapter, not a second copy of the
          # template text.
          sed -n '4,$p' skills/cross-review/templates/reviewer.md > "$tmp/want"
          sed -n '4,$p' "$tpl" > "$tmp/got"
          cmp -s "$tmp/want" "$tmp/got" || {
            echo "generated template body differs from templates/reviewer.md" >&2; exit 1; }
          # And it must refuse to overwrite.
          if sh "$tmp/skill/scripts/add-agent.sh" sampleagent 2>/dev/null; then
            echo "add-agent.sh overwrote an existing template" >&2; exit 1
          fi

      # `fixed` mode runs every case against the corrected module. Plain mode
      # is RED on A and B by design — the planted defects prove the tests
      # detect them — so CI asserts soundness and the process guarantees here.
      - name: Fixture — the process guarantees, against the shipped snapshot script
        run: sh tests/fixture/run-tests.sh fixed

      # The ps1 runner is a second adapter for the same modes. Run it too, or
      # a mode missing on Windows ships silently (measured: `fixed` was
      # ignored and the runner reported RED on correct code).
      - name: Fixture parity — the ps1 runner speaks the same modes
        run: pwsh -NoProfile -File tests/fixture/run-tests.ps1 fixed

      - name: locate-templates probes the directory hc actually reads
        run: |
          set -e
          s=skills/cross-review/scripts/locate-templates.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/appdata/herdr-core" "$tmp/xdg/herdr-core" "$tmp/home"

          # Windows-shaped: APPDATA wins over a stale ~/.config.
          got=$(APPDATA="$tmp/appdata" HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/xdg" \
                sh "$s")
          case "$got" in
            "$tmp"/appdata/herdr-core/templates) ;;
            *) echo "expected the APPDATA path, got: $got" >&2; exit 1 ;;
          esac

          # Unix-shaped: XDG wins when it exists.
          got=$(env -u APPDATA HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/xdg" \
                sh "$s")
          case "$got" in
            "$tmp"/xdg/herdr-core/templates) ;;
            *) echo "expected the XDG path, got: $got" >&2; exit 1 ;;
          esac

          # --create falls back to $HOME/.config, never to a bare /herdr-core.
          got=$(env -u APPDATA -u XDG_CONFIG_HOME HOME="$tmp/home" \
                sh "$s" --create)
          [ "$got" = "$tmp/home/.config/herdr-core/templates" ] || {
            echo "expected the ~/.config fallback, got: $got" >&2; exit 1; }

          # Without --create, nothing existing is exit 2, and nothing is created.
          if env -u APPDATA -u XDG_CONFIG_HOME HOME="$tmp/home" sh "$s"; then
            echo "expected exit 2 when nothing exists" >&2; exit 1; fi
          [ ! -d "$tmp/home/.config" ] || {
            echo "locate created $tmp/home/.config" >&2; exit 1; }

          # install --dry-run resolves the same target locate does.
          want=$(APPDATA="$tmp/appdata" HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/xdg" \
                 sh skills/cross-review/scripts/install-templates.sh --dry-run \
                 | sed -n 's/^target: //p')
          [ "$want" = "$tmp/appdata/herdr-core/templates" ] || {
            echo "install --dry-run picked: $want" >&2; exit 1; }

      - name: check-templates detects body drift and absence
        run: |
          set -e
          c=skills/cross-review/scripts/check-templates.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          # A faithful install passes: byte-identical files.
          mkdir -p "$tmp/target"
          cp skills/cross-review/templates/*.md "$tmp/target/"
          sh "$c" "$tmp/target"

          # A one-word body change is drift. The contract's header and the
          # delivery clause live in the body; hc's JSON listing cannot see
          # them, which is why this check compares files, not fields.
          sed -i 's/one pane in a review panel/one pane in a review panel (stale)/' \
            "$tmp/target/reviewer.md"
          if sh "$c" "$tmp/target"; then
            echo "body drift was not detected" >&2; exit 1; fi

          # A missing template file is absence.
          rm "$tmp/target/reviewer-opencode.md"
          if sh "$c" "$tmp/target"; then
            echo "absence was not detected" >&2; exit 1; fi

      - name: README points at the directory npx installs to
        run: |
          set -e
          ! grep -q '\.claude/skills/cross-review/scripts' README.md
          grep -q 'npx skills add' README.md
          grep -qi 'does not install\|not install the\|templates are separate\|second step' README.md

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            README.zh-CN.md
            skills/**/SKILL.md
            skills/**/references/*.md
            skills/**/examples/*.md
            skills/**/commands/*.md
        continue-on-error: true
