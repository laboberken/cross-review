name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e
          test -f SKILL.md
          test -f README.md
          test -f README.zh-CN.md
          test -f LICENSE
          test -f commands/cross-review.md

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          head -n 1 SKILL.md | grep -q '^---$'
          grep -q '^name: cross-review$' SKILL.md
          grep -q '^description:' SKILL.md
          grep -q '^license: MIT$' SKILL.md

      - name: Check references
        run: |
          set -e
          for f in lenses agents task-packet troubleshooting; do
            test -f "references/$f.md"
          done
          count=$(find references -name '*.md' | wc -l)
          echo "Reference files: $count"
          test "$count" -ge 4

      - name: Check templates
        run: |
          set -e
          test -f templates/reviewer.md
          test -f templates/reviewer-codex.md
          for f in templates/*.md; do
            head -n 1 "$f" | grep -q '^---$'
            grep -q '^command: ' "$f"
          done

      - name: Check examples
        run: |
          set -e
          count=$(find examples -name '*.md' | wc -l)
          echo "Example files: $count"
          test "$count" -ge 3

      - name: Check scripts
        run: |
          set -e
          test -f scripts/install-templates.sh
          test -f scripts/sync-codex-skills.sh
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            SKILL.md
            README.md
            README.zh-CN.md
            commands/*.md
            references/*.md
            examples/*.md
        continue-on-error: true
